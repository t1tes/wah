<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Letters 7-12 - Jaymiso</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* --- Video Background --- */
        .letter-group-bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -1;
            opacity: 0.6;
            filter: brightness(0.6);
        }

        /* --- Confetti Container --- */
        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            top: -10px;
            width: 10px;
            height: 10px;
            opacity: 0.8;
            animation: confetti-fall linear infinite;
            border-radius: 2px;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .confetti-container {
                display: none;
            }
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            color: #fff;
            font-family: 'JMHTypewriter', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .back-btn:hover {
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            .back-btn {
                top: 12px;
                left: 12px;
                padding: 8px 12px;
                font-size: 0.8rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .back-btn {
                transition: none;
            }
        }
    </style>
</head>
<body class="letter-group-page-body">
    <!-- Back Button -->
    <a href="menu.html" class="back-btn" aria-label="Back to menu">← Back</a>

    <!-- Confetti Container -->
    <div class="confetti-container" aria-hidden="true"></div>

    <video class="letter-group-bg-video" autoplay muted loop playsinline poster="media/LETTER7.png">
        <source src="media/letters-bg.mp4" type="video/mp4">
    </video>

    <div class="letter-group-page">
        <h1>2: 10:36</h1>
        <ul>
            <li><a href="letters/transition.html?target=letter7.html&name=Letter 7"><img src="media/LETTER7.png" alt="Letter 7" loading="lazy"></a></li>
            <li><a href="letters/transition.html?target=letter8.html&name=Letter 8"><img src="media/LETTER8.png" alt="Letter 8" loading="lazy"></a></li>
            <li><a href="letters/transition.html?target=letter9.html&name=Letter 9"><img src="media/LETTER9.png" alt="Letter 9" loading="lazy"></a></li>
            <li><a href="letters/transition.html?target=letter10.html&name=Letter 10"><img src="media/LETTER10.png" alt="Letter 10" loading="lazy"></a></li>
            <li><a href="letters/transition.html?target=letter11.html&name=Letter 11"><img src="media/LETTER11.png" alt="Letter 11" loading="lazy"></a></li>
            <li><a href="letters/transition.html?target=letter12.html&name=Letter 12"><img src="media/LETTER12.png" alt="Letter 12" loading="lazy"></a></li>
        </ul>
    </div>
    <script>
        // Generate confetti
        const confettiContainer = document.querySelector('.confetti-container');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!prefersReducedMotion && confettiContainer) {
            const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#ff6b9a', '#a29bfe', '#fd79a8', '#00cec9', '#fdcb6e', '#e17055', '#74b9ff', '#fab1a0', '#55efc4', '#ffeaa7', '#ff7675', '#a29bfe', '#ffffff'];
            const confettiCount = 30;

            function createConfetti() {
                const fragment = document.createDocumentFragment();

                for (let i = 0; i < confettiCount; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';

                    const size = Math.random() * 6 + 6;
                    const left = Math.random() * 100;
                    const duration = Math.random() * 8 + 10;
                    const delay = Math.random() * 6;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const borderRadius = Math.random() > 0.6 ? '50%' : '2px';
                    const rotation = Math.random() * 360;
                    const rotationSpeed = (Math.random() - 0.5) * 720;

                    confetti.style.cssText = `
                        left: ${left}%;
                        width: ${size}px;
                        height: ${size}px;
                        background-color: ${color};
                        border-radius: ${borderRadius};
                        animation-duration: ${duration}s;
                        animation-delay: ${delay}s;
                        transform: rotate(${rotation}deg);
                    `;

                    confetti.style.setProperty('--rotation-end', `${rotation + rotationSpeed}deg`);

                    fragment.appendChild(confetti);
                }

                confettiContainer.appendChild(fragment);
            }

            // Add rotation keyframes dynamically
            const style = document.createElement('style');
            style.textContent = `
                @keyframes confetti-fall {
                    0% { transform: translateY(-10vh) rotate(var(--rotation-start, 0deg)); opacity: 0.8; }
                    100% { transform: translateY(110vh) rotate(var(--rotation-end, 720deg)); opacity: 0; }
                }
                .confetti { --rotation-start: 0deg; }
            `;
            document.head.appendChild(style);

            // Initialize confetti
            createConfetti();

            // Respect reduced motion changes
            const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
            mediaQuery.addEventListener('change', (e) => {
                if (e.matches) {
                    confettiContainer.style.display = 'none';
                } else {
                    confettiContainer.style.display = '';
                }
            });
        }
    </script>
    <script src="scripts/page-transitions.js"></script>
</body>
</html>
