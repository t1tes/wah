<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Happy Birthday Jaymiso</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="home-page">
        <video autoplay muted loop playsinline>
            <source src="media/bg.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- Confetti Container -->
        <div class="confetti-container" aria-hidden="true"></div>

        <div class="content" id="home-content">
            <div class="content-line">Happy 18th Birthday</div>
            <div class="content-line">my Jaymiso!</div>
        </div>
    </div>

    <script>
        // Generate dynamic confetti pieces
        const confettiContainer = document.querySelector('.confetti-container');
        const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#ff6b9a', '#a29bfe', '#fd79a8', '#00cec9', '#fdcb6e', '#e17055', '#74b9ff', '#fab1a0', '#55efc4', '#ffeaa7', '#ff7675', '#a29bfe'];

        function createConfetti() {
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 8 + 6 + 'px';
                confetti.style.height = Math.random() * 8 + 6 + 'px';
                confetti.style.animationDuration = Math.random() * 4 + 6 + 's';
                confetti.style.animationDelay = Math.random() * 5 + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                confettiContainer.appendChild(confetti);
            }
        }

        // Initialize confetti
        createConfetti();

        // Respect reduced motion preference
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (prefersReducedMotion.matches) {
            confettiContainer.style.display = 'none';
        }

        // Click handler to navigate to menu
        document.getElementById('home-content').addEventListener('click', () => {
            window.location.href = 'menu.html';
        });

        // Apply rotation after animation completes
        setTimeout(() => {
            document.querySelectorAll('.content-line').forEach(line => {
                line.classList.add('revealed');
            });
        }, 1700); // After last animation (0.4s delay + ~1100ms duration + buffer)
    </script>
    <script src="scripts/page-transitions.js"></script>
</body>
</html>
