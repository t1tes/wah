<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Jaymiso</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Background Elements -->
    <div class="background-elements">
        <div></div>
        <div></div>
        <div></div>
    </div>

    <div class="home-page">
        <video autoplay muted loop playsinline>
            <source src="media/ScreenRecording_07-22-2026 22-36-32_1.mov" type="video/quicktime">
            Your browser does not support the video tag.
        </video>
        <div class="content">
            <div class="content-line">Happy Birthday 18th</div>
            <div class="content-line">my Jaymiso</div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const contentDiv = document.querySelector('.content');
            if (contentDiv) {
                // Make text clickable to go to menu
                contentDiv.style.cursor = 'pointer';
                contentDiv.addEventListener('click', function() {
                    window.location.href = 'menu.html';
                });

                // Add a subtle pulse animation
                let scale = 1;
                let growing = true;
                setInterval(() => {
                    if (growing) {
                        scale += 0.003;
                        if (scale >= 1.02) growing = false;
                    } else {
                        scale -= 0.003;
                        if (scale <= 0.98) growing = true;
                    }
                    contentDiv.style.transform = `translate(-50%, -50%) scale(${scale})`;
                }, 50);
            }
        });
    </script>
</body>
</html>
