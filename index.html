<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Jaymiso</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Background Elements -->
    <div class="background-elements">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>

    <!-- Confetti Container (will be populated by JS) -->
    <div class="confetti-container" id="confettiContainer"></div>

    <div class="home-page">
        <video autoplay muted loop playsinline>
            <source src="media/bg.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <audio id="bgm" autoplay loop>
            <source src="media/bgm.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <div class="content">Happy Birthday 18th my Jaymiso</div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const contentDiv = document.querySelector('.content');
            if (contentDiv) {
                // Make text clickable to go to menu
                contentDiv.style.cursor = 'pointer';
                contentDiv.addEventListener('click', function() {
                    window.location.href = 'menu.html';
                });

                // Add a subtle pulse animation
                let scale = 1;
                let growing = true;
                setInterval(() => {
                    if (growing) {
                        scale += 0.003;
                        if (scale >= 1.02) growing = false;
                    } else {
                        scale -= 0.003;
                        if (scale <= 0.98) growing = true;
                    }
                    contentDiv.style.transform = `translate(-50%, -50%) scale(${scale})`;
                }, 50);

                // Initialize confetti effect occasionally
                setInterval(createConfetti, 3000);
            }
        });

        // Confetti functionality
        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            if (!container) return;

            // Create 5-15 confetti pieces
            const count = Math.floor(Math.random() * 11) + 5;

            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';

                // Random position
                confetti.style.left = Math.random() * 100 + 'vw';

                // Random color
                const hue = Math.floor(Math.random() * 360);
                confetti.style.setProperty('--hue', hue);

                // Random size
                const size = Math.random() * 8 + 5;
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';

                // Random animation duration and delay
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 2;
                confetti.style.animationDuration = duration + 's';
                confetti.style.animationDelay = delay + 's';

                // Random rotation
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;

                container.appendChild(confetti);

                // Remove after animation ends
                setTimeout(() => {
                    confetti.remove();
                }, (duration + delay) * 1000);
            }
        }
    </script>
</body>
</html>
