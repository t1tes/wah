<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Letters 13-18 - Jaymiso</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* --- Video Background --- */
        .letter-group-bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -1;
            opacity: 0.6;
            filter: brightness(0.6);
        }

        /* --- Fireworks Container --- */
        .fireworks-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .firework {
            position: absolute;
            bottom: 0;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: firework-rise var(--duration) cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .firework-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: inherit;
            opacity: 0;
            animation: firework-burst var(--burst-delay) ease-out forwards;
        }

        @keyframes firework-rise {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) scale(0.3);
                opacity: 0;
            }
        }

        @keyframes firework-burst {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* --- Confetti Container (for reverse animation) --- */
        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
            display: none;
        }

        .confetti-container.confetti-reverse .confetti {
            animation: confetti-rise linear forwards !important;
        }

        .confetti {
            position: absolute;
            top: -10px;
            width: 10px;
            height: 10px;
            opacity: 0.8;
            animation: confetti-fall linear infinite;
            border-radius: 2px;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        @keyframes confetti-rise {
            0% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0;
            }
        }

        /* More button */
        .more-container {
            margin-top: 180px;
            text-align: center;
            width: 100%;
        }

        .more-btn {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.5);
            font-family: 'JMHTypewriter', monospace;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 8px 0;
            cursor: pointer;
            display: block;
            margin: 0 auto;
        }

        .more-btn:hover {
            color: #fff;
        }

        .more-btn:focus {
            outline: none;
        }

        /* Letter 19 reveal */
        .letter-19 {
            margin-top: 160px;
            padding: 40px 20px;
            text-align: center;
            width: 100vw;
            max-width: none;
            margin-left: calc(50% - 50vw);
            animation: letter19-reveal 0.6s ease-out forwards;
        }

        @keyframes letter19-reveal {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .letter-19-text {
            font-family: 'JMHTypewriter', monospace;
            font-size: 1.1rem;
            color: rgba(255,255,255,0.6);
            margin-bottom: 16px;
            line-height: 1.6;
            white-space: nowrap;
            display: block;
            text-align: center;
        }

        .letter-19-title {
            font-family: 'JMHTypewriter', monospace;
            font-size: 1.3rem;
            color: #fff;
            line-height: 1.4;
            white-space: nowrap;
            cursor: pointer;
            transition: opacity 0.3s ease;
            display: block;
            text-align: center;
            /* Override .letter-group-page a card styles */
            background: none !important;
            border: none !important;
            border-radius: 0 !important;
            padding: 0 !important;
            box-shadow: none !important;
            max-width: none !important;
            width: auto !important;
            font-weight: 700;
        }

        .letter-19-title:hover {
            opacity: 0.7;
            transform: none !important;
            color: #fff !important;
            background: none !important;
            border: none !important;
            box-shadow: none !important;
        }

        .letter-19-title strong {
            font-weight: 700;
        }

        @media (prefers-reduced-motion: reduce) {
            .letter-19 {
                animation: none;
            }
        }
    </style>
</head>
<body class="letter-group-page-body">
    <!-- Fireworks Container -->
    <div class="fireworks-container" aria-hidden="true"></div>

    <!-- Confetti Container (for reverse animation on More button) -->
    <div class="confetti-container" aria-hidden="true"></div>

    <video class="letter-group-bg-video" autoplay muted loop playsinline poster="media/letter13.svg">
        <source src="media/letters-bg.mp4" type="video/mp4">
    </video>

    <div class="letter-group-page">
        <h1>Letters 13&ndash;18</h1>
        <ul>
            <li><a href="letters/letter3-1.html"><img src="media/letter13.svg" alt="Letter 13" loading="lazy"></a></li>
            <li><a href="letters/letter3-2.html"><img src="media/letter14.svg" alt="Letter 14" loading="lazy"></a></li>
            <li><a href="letters/letter3-3.html"><img src="media/letter15.svg" alt="Letter 15" loading="lazy"></a></li>
            <li><a href="letters/letter3-4.html"><img src="media/letter16.svg" alt="Letter 16" loading="lazy"></a></li>
            <li><a href="letters/letter3-5.html"><img src="media/letter17.svg" alt="Letter 17" loading="lazy"></a></li>
            <li><a href="letters/letter3-6.html"><img src="media/letter18.svg" alt="Letter 18" loading="lazy"></a></li>
        </ul>

        <!-- More button -->
        <div class="more-container">
            <button class="more-btn" id="moreBtn" aria-expanded="false" aria-controls="letter19">More</button>
        </div>

        <!-- Hidden 19th letter -->
        <div class="letter-19" id="letter19" hidden>
            <p class="letter-19-text">we never reached your birthday</p>
            <a href="letters/letter3-7.html" class="letter-19-title"><strong>LETTER 19</strong></a>
        </div>
    </div>
    <script>
        // Generate dynamic fireworks
        const fireworksContainer = document.querySelector('.fireworks-container');
        const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#ff6b9a', '#a29bfe', '#fd79a8', '#00cec9', '#fdcb6e', '#e17055', '#74b9ff', '#fab1a0', '#55efc4', '#ffeaa7', '#ff7675', '#a29bfe'];

        function createFirework() {
            const firework = document.createElement('div');
            firework.className = 'firework';
            const left = Math.random() * 100 + '%';
            const color = colors[Math.floor(Math.random() * colors.length)];
            const duration = Math.random() * 3 + 4;
            const burstDelay = Math.random() * 1 + 0.5;
            const burstTime = duration * 0.75; // Burst at 75% of rise

            firework.style.left = left;
            firework.style.bottom = '-20px';
            firework.style.backgroundColor = color;
            firework.style.setProperty('--duration', duration + 's');
            firework.style.setProperty('--burst-delay', burstDelay + 's');
            fireworksContainer.appendChild(firework);

            // Create burst particles when firework reaches peak
            setTimeout(() => {
                createBurst(left, color);
                firework.remove(); // Remove the rocket
            }, burstTime * 1000);

            // Cleanup fallback
            setTimeout(() => firework.remove(), 8000);
        }

        function createBurst(left, color) {
            const particleCount = 12;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework-particle';
                particle.style.left = left;
                particle.style.bottom = '100vh'; // Start from top where rocket exploded
                particle.style.backgroundColor = color;
                const angle = (i / particleCount) * Math.PI * 2;
                const distance = Math.random() * 60 + 40; // 40-100px
                const tx = Math.cos(angle) * distance + 'px';
                const ty = Math.sin(angle) * distance + 'px';
                particle.style.setProperty('--tx', tx);
                particle.style.setProperty('--ty', ty);
                particle.style.setProperty('--burst-delay', (Math.random() * 0.5 + 0.8) + 's');
                fireworksContainer.appendChild(particle);
                setTimeout(() => particle.remove(), 3000);
            }
        }

        // Spawn fireworks periodically
        function spawnFireworks() {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            createFirework();
            // Random interval between 800-2000ms
            setTimeout(spawnFireworks, Math.random() * 1200 + 800);
        }

        // Initialize fireworks
        spawnFireworks();

        // Respect reduced motion preference
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (prefersReducedMotion.matches) {
            fireworksContainer.style.display = 'none';
        }

        // Generate confetti for reverse animation
        (function() {
            const confettiContainer = document.querySelector('.confetti-container');
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            if (prefersReducedMotion || !confettiContainer) return;

            const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#ff6b9a', '#a29bfe', '#fd79a8', '#00cec9', '#fdcb6e', '#e17055', '#74b9ff', '#fab1a0', '#55efc4', '#ffeaa7', '#ff7675', '#a29bfe', '#ffffff'];
            const confettiCount = 30;

            function createConfetti() {
                const fragment = document.createDocumentFragment();

                for (let i = 0; i < confettiCount; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';

                    const size = Math.random() * 6 + 6;
                    const left = Math.random() * 100;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const borderRadius = Math.random() > 0.6 ? '50%' : '2px';

                    confetti.style.cssText = `
                        left: ${left}%;
                        width: ${size}px;
                        height: ${size}px;
                        background-color: ${color};
                        border-radius: ${borderRadius};
                        animation-duration: ${Math.random() * 8 + 10}s;
                        animation-delay: ${Math.random() * 6}s;
                    `;

                    fragment.appendChild(confetti);
                }

                confettiContainer.appendChild(fragment);
            }

            // Initialize confetti (hidden initially)
            createConfetti();

            // More button toggle for Letter 19
            const moreBtn = document.getElementById('moreBtn');
            const letter19 = document.getElementById('letter19');

            moreBtn.addEventListener('click', () => {
                const isExpanded = moreBtn.getAttribute('aria-expanded') === 'true';
                moreBtn.setAttribute('aria-expanded', !isExpanded);
                letter19.hidden = isExpanded;

                if (!isExpanded) {
                    moreBtn.textContent = 'Less';
                    // Show confetti reverse animation
                    confettiContainer.style.display = 'block';
                    confettiContainer.classList.add('confetti-reverse');
                    // Remove reverse class after animation
                    setTimeout(() => {
                        confettiContainer.classList.remove('confetti-reverse');
                        confettiContainer.style.display = 'none';
                    }, 3000);
                } else {
                    moreBtn.textContent = 'More';
                }
            });
        })();
    </script>
    <script src="scripts/page-transitions.js"></script>
</body>
</html>
