<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letters 13-18 - Jaymiso</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Letter images for each button */
        .letter-group-page .letter-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            display: block;
        }
    </style>
</head>
<body>
    <!-- Confetti Container -->
    <div class="confetti-container" aria-hidden="true"></div>

    <div class="letter-group-page">
        <h1>Letters 13&thinsp;&ndash;&thinsp;18</h1>
        <ul>
            <li><a href="letters/letter3-1.html"><img src="media/letter13.jpg" alt="Letter 13" class="letter-image" loading="lazy"><span>Letter 13</span></a></li>
            <li><a href="letters/letter3-2.html"><img src="media/letter14.jpg" alt="Letter 14" class="letter-image" loading="lazy"><span>Letter 14</span></a></li>
            <li><a href="letters/letter3-3.html"><img src="media/letter15.jpg" alt="Letter 15" class="letter-image" loading="lazy"><span>Letter 15</span></a></li>
            <li><a href="letters/letter3-4.html"><img src="media/letter16.jpg" alt="Letter 16" class="letter-image" loading="lazy"><span>Letter 16</span></a></li>
            <li><a href="letters/letter3-5.html"><img src="media/letter17.jpg" alt="Letter 17" class="letter-image" loading="lazy"><span>Letter 17</span></a></li>
            <li><a href="letters/letter3-6.html"><img src="media/letter18.jpg" alt="Letter 18" class="letter-image" loading="lazy"><span>Letter 18</span></a></li>
        </ul>
    </div>
    <script>
        // Generate dynamic confetti
        const confettiContainer = document.querySelector('.confetti-container');
        const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#ff6b9a', '#a29bfe', '#fd79a8', '#00cec9', '#fdcb6e', '#e17055', '#74b9ff', '#fab1a0', '#55efc4', '#ffeaa7', '#ff7675', '#a29bfe'];

        function createConfetti() {
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 8 + 6 + 'px';
                confetti.style.height = Math.random() * 8 + 6 + 'px';
                confetti.style.animationDuration = Math.random() * 4 + 6 + 's';
                confetti.style.animationDelay = Math.random() * 5 + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                confettiContainer.appendChild(confetti);
            }
        }

        // Initialize confetti
        createConfetti();

        // Respect reduced motion preference
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (prefersReducedMotion.matches) {
            confettiContainer.style.display = 'none';
        }
    </script>
</body>
</html>
