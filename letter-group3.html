<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Letters 13-18 - Jaymiso</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* --- Video Background --- */
        .letter-group-bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -1;
            opacity: 0.6;
            filter: brightness(0.6);
        }

        /* --- Confetti Container (ambient) --- */
        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .confetti-container .confetti {
            position: absolute;
            top: -10px;
            width: 10px;
            height: 10px;
            opacity: 0.8;
            animation: confetti-fall linear infinite;
            border-radius: 2px;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* --- Confetti Reverse Container (for More button) --- */
        .confetti-reverse-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
            display: none;
        }

        .confetti-reverse-container .confetti {
            position: absolute;
            bottom: -10px;
            width: 10px;
            height: 10px;
            opacity: 0.8;
            animation: confetti-rise linear infinite;
            border-radius: 2px;
        }

        @keyframes confetti-rise {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-120vh) rotate(720deg);
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .confetti-container,
            .confetti-reverse-container {
                display: none !important;
            }
        }

        /* More button */
        .more-container {
            margin-top: 180px;
            text-align: center;
            width: 100%;
        }

        .more-btn {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.5);
            font-family: 'JMHTypewriter', monospace;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 8px 0;
            cursor: pointer;
            display: block;
            margin: 0 auto;
        }

        .more-btn:hover {
            color: #fff;
        }

        .more-btn:focus {
            outline: none;
        }

        /* Letter 19 reveal */
        .letter-19 {
            margin-top: 160px;
            padding: 40px 20px;
            text-align: center;
            width: 100vw;
            max-width: none;
            margin-left: calc(50% - 50vw);
            animation: letter19-reveal 0.6s ease-out forwards;
        }

        @keyframes letter19-reveal {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .letter-19-text {
            font-family: 'JMHTypewriter', monospace;
            font-size: 1.1rem;
            color: rgba(255,255,255,0.6);
            margin-bottom: 16px;
            line-height: 1.6;
            white-space: nowrap;
            display: block;
            text-align: center;
        }

        .letter-19-title {
            font-family: 'JMHTypewriter', monospace;
            font-size: 1.3rem;
            color: #fff;
            line-height: 1.4;
            white-space: nowrap;
            cursor: pointer;
            transition: opacity 0.3s ease;
            display: block;
            text-align: center;
            /* Override .letter-group-page a card styles */
            background: none !important;
            border: none !important;
            border-radius: 0 !important;
            padding: 0 !important;
            box-shadow: none !important;
            max-width: none !important;
            width: auto !important;
            font-weight: 700;
        }

        .letter-19-title:hover {
            opacity: 0.7;
            transform: none !important;
            color: #fff !important;
            background: none !important;
            border: none !important;
            box-shadow: none !important;
        }

        .letter-19-title strong {
            font-weight: 700;
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            color: #fff;
            font-family: 'JMHTypewriter', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .back-btn:hover {
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            .back-btn {
                top: 12px;
                left: 12px;
                padding: 8px 12px;
                font-size: 0.8rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .back-btn {
                transition: none;
            }
        }
    </style>
</head>
<body class="letter-group-page-body">
    <!-- Back Button -->
    <a href="menu.html" class="back-btn" aria-label="Back to menu">← Back</a>

    <!-- Confetti Container (ambient) -->
    <div class="confetti-container" aria-hidden="true"></div>

    <!-- Confetti Reverse Container (for More button) -->
    <div class="confetti-reverse-container" aria-hidden="true"></div>

    <video class="letter-group-bg-video" autoplay muted loop playsinline poster="media/LETTER13.png">
        <source src="media/letters-bg.mp4" type="video/mp4">
    </video>

    <div class="letter-group-page">
        <h1>3: SOREN</h1>
        <ul>
            <li><a href="letters/transition.html?target=letter3-1.html&name=Letter 13"><img src="media/LETTER13.png" alt="Letter 13" loading="lazy"></a></li>
            <li><a href="letters/transition.html?target=letter3-2.html&name=Letter 14"><img src="media/LETTER14.png" alt="Letter 14" loading="lazy"></a></li>
            <li><a href="letters/transition.html?target=letter3-3.html&name=Letter 15"><img src="media/LETTER15.png" alt="Letter 15" loading="lazy"></a></li>
            <li><a href="letters/transition.html?target=letter3-4.html&name=Letter 16"><img src="media/LETTER16.png" alt="Letter 16" loading="lazy"></a></li>
            <li><a href="letters/transition.html?target=letter3-5.html&name=Letter 17"><img src="media/LETTER17.png" alt="Letter 17" loading="lazy"></a></li>
            <li><a href="letters/transition.html?target=letter3-6.html&name=Letter 18"><img src="media/LETTER18.png" alt="Letter 18" loading="lazy"></a></li>
        </ul>

        <!-- More button -->
        <div class="more-container">
            <button class="more-btn" id="moreBtn" aria-expanded="false" aria-controls="letter19">More</button>
        </div>

        <!-- Hidden 19th letter -->
        <div class="letter-19" id="letter19" hidden>
            <p class="letter-19-text">we never reached your birthday</p>
            <a href="letters/transition.html?target=letter3-7.html&name=Letter 19" class="letter-19-title"><strong>LETTER 19</strong></a>
        </div>
    </div>
    <script>
        // Ambient confetti
        (function() {
            const confettiContainer = document.querySelector('.confetti-container');
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            if (prefersReducedMotion || !confettiContainer) return;

            const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#ff6b9a', '#a29bfe', '#fd79a8', '#00cec9', '#fdcb6e', '#e17055', '#74b9ff', '#fab1a0', '#55efc4', '#ffeaa7', '#ff7675', '#a29bfe', '#ffffff'];
            const confettiCount = 30;

            function createConfetti() {
                const fragment = document.createDocumentFragment();

                for (let i = 0; i < confettiCount; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';

                    const size = Math.random() * 6 + 6;
                    const left = Math.random() * 100;
                    const duration = Math.random() * 8 + 10;
                    const delay = Math.random() * 6;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const borderRadius = Math.random() > 0.6 ? '50%' : '2px';
                    const rotation = Math.random() * 360;
                    const rotationSpeed = (Math.random() - 0.5) * 720;

                    confetti.style.cssText = `
                        left: ${left}%;
                        width: ${size}px;
                        height: ${size}px;
                        background-color: ${color};
                        border-radius: ${borderRadius};
                        animation-duration: ${duration}s;
                        animation-delay: ${delay}s;
                        transform: rotate(${rotation}deg);
                    `;

                    confetti.style.setProperty('--rotation-end', `${rotation + rotationSpeed}deg`);

                    fragment.appendChild(confetti);
                }

                confettiContainer.appendChild(fragment);
            }

            // Add rotation keyframes dynamically
            const style = document.createElement('style');
            style.textContent = `
                @keyframes confetti-fall {
                    0% { transform: translateY(-10vh) rotate(var(--rotation-start, 0deg)); opacity: 0.8; }
                    100% { transform: translateY(110vh) rotate(var(--rotation-end, 720deg)); opacity: 0; }
                }
                .confetti { --rotation-start: 0deg; }
            `;
            document.head.appendChild(style);

            // Initialize confetti
            createConfetti();

            // Respect reduced motion changes
            const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
            mediaQuery.addEventListener('change', (e) => {
                if (e.matches) {
                    confettiContainer.style.display = 'none';
                } else {
                    confettiContainer.style.display = '';
                }
            });
        })();

        // Reverse confetti for More button
        (function() {
            const reverseContainer = document.querySelector('.confetti-reverse-container');
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            if (prefersReducedMotion || !reverseContainer) return;

            const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#ff6b9a', '#a29bfe', '#fd79a8', '#00cec9', '#fdcb6e', '#e17055', '#74b9ff', '#fab1a0', '#55efc4', '#ffeaa7', '#ff7675', '#a29bfe', '#ffffff'];
            const confettiCount = 30;

            function createConfetti() {
                const fragment = document.createDocumentFragment();

                for (let i = 0; i < confettiCount; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';

                    const size = Math.random() * 6 + 6;
                    const left = Math.random() * 100;
                    const duration = Math.random() * 4 + 3;
                    const delay = Math.random() * 3;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const borderRadius = Math.random() > 0.6 ? '50%' : '2px';
                    const rotation = Math.random() * 360;
                    const rotationSpeed = (Math.random() - 0.5) * 720;

                    confetti.style.cssText = `
                        left: ${left}%;
                        width: ${size}px;
                        height: ${size}px;
                        background-color: ${color};
                        border-radius: ${borderRadius};
                        animation-duration: ${duration}s;
                        animation-delay: ${delay}s;
                        transform: rotate(${rotation}deg);
                    `;

                    confetti.style.setProperty('--rotation-end', `${rotation + rotationSpeed}deg`);

                    fragment.appendChild(confetti);
                }

                reverseContainer.appendChild(fragment);
            }

            // Add rotation keyframes
            const style = document.createElement('style');
            style.textContent = `
                @keyframes confetti-rise {
                    0% { transform: translateY(0) rotate(var(--rotation-start, 0deg)); opacity: 0.8; }
                    100% { transform: translateY(-120vh) rotate(var(--rotation-end, 720deg)); opacity: 0; }
                }
                .confetti { --rotation-start: 0deg; }
            `;
            document.head.appendChild(style);

            // Initialize confetti
            createConfetti();

            // More button toggle for Letter 19
            const moreBtn = document.getElementById('moreBtn');
            const letter19 = document.getElementById('letter19');

            moreBtn.addEventListener('click', () => {
                const isExpanded = moreBtn.getAttribute('aria-expanded') === 'true';
                moreBtn.setAttribute('aria-expanded', !isExpanded);
                letter19.hidden = isExpanded;

                const ambientContainer = document.querySelector('.confetti-container');

                if (!isExpanded) {
                    moreBtn.textContent = 'Less';
                    // Hide ambient confetti (falling from top)
                    if (ambientContainer) ambientContainer.style.display = 'none';
                    // Show reverse confetti (rising from bottom) - continuous
                    reverseContainer.style.display = 'block';
                } else {
                    moreBtn.textContent = 'More';
                    // Show ambient confetti again
                    if (ambientContainer) ambientContainer.style.display = 'block';
                    // Hide reverse confetti
                    reverseContainer.style.display = 'none';
                }
            });
        })();
    </script>
    <script src="scripts/page-transitions.js"></script>
</body>
</html>
