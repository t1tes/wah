<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Jaymiso Letters</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Confetti Container -->
    <div class="confetti-container" aria-hidden="true"></div>

    <div class="menu-page">
        <div class="intro-text">
            Happy birthday Jayme! Since we met during the year you turned 18, I decided to write you 18 letters, one for each year our paths haven’t crossed. Each one contains things i think you’d like or need to hear whenever you’re going through these moments. I really hope you like it :)
        </div>
        <div class="button-container">
            <a href="letter-group1.html" class="button-wrapper">
                <img src="media/image3.jpg" alt="Letters 1-6: Early encouragement and foundation">
                <span class="button-number">1</span>
            </a>
            <a href="letter-group2.html" class="button-wrapper">
                <img src="media/image4.jpg" alt="Letters 7-12: Guidance for growing confidence">
                <span class="button-number">2</span>
            </a>
            <a href="letter-group3.html" class="button-wrapper">
                <img src="media/image5.jpg" alt="Letters 13-18: Wisdom for emerging adulthood">
                <span class="button-number">3</span>
            </a>
        </div>
    </div>
    <script>
        // Generate dynamic confetti
        const confettiContainer = document.querySelector(‘.confetti-container’);
        const colors = [‘#ff6b6b’, ‘#4ecdc4’, ‘#ffe66d’, ‘#ff6b9a’, ‘#a29bfe’, ‘#fd79a8’, ‘#00cec9’, ‘#fdcb6e’, ‘#e17055’, ‘#74b9ff’, ‘#fab1a0’, ‘#55efc4’, ‘#ffeaa7’, ‘#ff7675’, ‘#a29bfe’];

        function createConfetti() {
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement(‘div’);
                confetti.className = ‘confetti’;
                confetti.style.left = Math.random() * 100 + ‘%’;
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 8 + 6 + ‘px’;
                confetti.style.height = Math.random() * 8 + 6 + ‘px’;
                confetti.style.animationDuration = Math.random() * 4 + 6 + ‘s’;
                confetti.style.animationDelay = Math.random() * 5 + ‘s’;
                confetti.style.borderRadius = Math.random() > 0.5 ? ‘50%’ : ‘2px’;
                confettiContainer.appendChild(confetti);
            }
        }

        createConfetti();

        // Respect reduced motion
        const prefersReducedMotion = window.matchMedia(‘(prefers-reduced-motion: reduce)’);
        if (prefersReducedMotion.matches) {
            confettiContainer.style.display = ‘none’;
        }

        // Button click handlers
        document.addEventListener(‘DOMContentLoaded’, function() {
            document.querySelectorAll(‘.button-wrapper’).forEach((wrapper, index) => {
                wrapper.style.cursor = ‘pointer’;
                wrapper.addEventListener(‘click’, () => {
                    window.location.href = `letter-group${index + 1}.html`;
                });
            });
        });
    </script>
</body>
</html>
