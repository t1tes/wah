<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letters 1-6 - Jaymiso</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Confetti Container -->
    <div class="confetti-container" aria-hidden="true"></div>

    <div class="letter-group-page">
        <h1>Letters 1&ndash;6</h1>
        <ul>
            <li><a href="letters/letter1-1.html"><img src="media/letter1.jpg" alt="Letter 1" loading="lazy"><span>Letter 1</span></a></li>
            <li><a href="letters/letter1-2.html"><img src="media/letter2.jpg" alt="Letter 2" loading="lazy"><span>Letter 2</span></a></li>
            <li><a href="letters/letter1-3.html"><img src="media/letter3.jpg" alt="Letter 3" loading="lazy"><span>Letter 3</span></a></li>
            <li><a href="letters/letter1-4.html"><img src="media/letter4.jpg" alt="Letter 4" loading="lazy"><span>Letter 4</span></a></li>
            <li><a href="letters/letter1-5.html"><img src="media/letter5.jpg" alt="Letter 5" loading="lazy"><span>Letter 5</span></a></li>
            <li><a href="letters/letter1-6.html"><img src="media/letter6.jpg" alt="Letter 6" loading="lazy"><span>Letter 6</span></a></li>
        </ul>
    </div>
    <script>
        // Generate dynamic confetti
        const confettiContainer = document.querySelector('.confetti-container');
        const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#ff6b9a', '#a29bfe', '#fd79a8', '#00cec9', '#fdcb6e', '#e17055', '#74b9ff', '#fab1a0', '#55efc4', '#ffeaa7', '#ff7675', '#a29bfe'];

        function createConfetti() {
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 8 + 6 + 'px';
                confetti.style.height = Math.random() * 8 + 6 + 'px';
                confetti.style.animationDuration = Math.random() * 4 + 6 + 's';
                confetti.style.animationDelay = Math.random() * 5 + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                confettiContainer.appendChild(confetti);
            }
        }

        // Initialize confetti
        createConfetti();

        // Respect reduced motion preference
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (prefersReducedMotion.matches) {
            confettiContainer.style.display = 'none';
        }
    </script>
</body>
</html>
