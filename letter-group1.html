<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Letters 1-6 - Jaymiso</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* --- Video Background --- */
        .letter-group-bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -1;
            opacity: 0.6;
            filter: brightness(0.6);
        }
    </style>
</head>
<body class="letter-group-page-body">
    <!-- Confetti Container -->
    <div class="confetti-container" aria-hidden="true"></div>

    <video class="letter-group-bg-video" autoplay muted loop playsinline poster="media/letter1.svg">
        <source src="media/letters-bg.mp4" type="video/mp4">
    </video>

    <div class="letter-group-page">
        <h1>Letters 1&ndash;6</h1>
        <ul>
            <li><a href="letters/letter1-1.html"><img src="media/letter1.svg" alt="Letter 1" loading="lazy"></a></li>
            <li><a href="letters/letter1-2.html"><img src="media/letter2.svg" alt="Letter 2" loading="lazy"></a></li>
            <li><a href="letters/letter1-3.html"><img src="media/letter3.svg" alt="Letter 3" loading="lazy"></a></li>
            <li><a href="letters/letter1-4.html"><img src="media/letter4.svg" alt="Letter 4" loading="lazy"></a></li>
            <li><a href="letters/letter1-5.html"><img src="media/letter5.svg" alt="Letter 5" loading="lazy"></a></li>
            <li><a href="letters/letter1-6.html"><img src="media/letter6.svg" alt="Letter 6" loading="lazy"></a></li>
        </ul>
    </div>
    <script>
        // Generate dynamic confetti
        const confettiContainer = document.querySelector('.confetti-container');
        const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#ff6b9a', '#a29bfe', '#fd79a8', '#00cec9', '#fdcb6e', '#e17055', '#74b9ff', '#fab1a0', '#55efc4', '#ffeaa7', '#ff7675', '#a29bfe'];

        function createConfetti() {
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 8 + 6 + 'px';
                confetti.style.height = Math.random() * 8 + 6 + 'px';
                confetti.style.animationDuration = Math.random() * 4 + 6 + 's';
                confetti.style.animationDelay = Math.random() * 5 + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                confettiContainer.appendChild(confetti);
            }
        }

        // Initialize confetti
        createConfetti();

        // Respect reduced motion preference
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (prefersReducedMotion.matches) {
            confettiContainer.style.display = 'none';
        }
    </script>
    <script src="scripts/page-transitions.js"></script>
</body>
</html>
